[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vending-attention-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "opencv-contrib-python>=5,<6",
  "mediapipe>=0.10.35,<0.11",
  "openvino>=2026,<2027",
  "msgpack>=1.1,<2",
]

[project.optional-dependencies]
test = ["pytest>=9,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
